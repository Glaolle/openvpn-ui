<!DOCTYPE html>
<html data-bs-theme="light">

<head>
  {{template "common/header.html" .}}
  {{template "head" .}}
</head>

<body class="hold-transition">
  <div class="app-wrapper">
    <nav class="app-header navbar navbar-expand-xl">
       <!-- navbar-light bg-body-tertiary -->
      <div class="container-fluid">
        <a href='{{urlfor "MainController.Get"}}' class="navbar-brand">
          <img src="/static/img/openvpn-win.svg" alt="OpenVPN UI Logo" class="brand-image rounded-circle shadow"
            style="opacity: .8">
          <span class="brand-text fw-light"><b>OpenVPN</b> UI</span></a>
        <button class="navbar-toggler order-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
          aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div class="collapse navbar-collapse" id="navbarCollapse">
          {{ template "common/header-top-menu.html" . }}
        </div>
        <!-- /.navbar-collapse -->
        <!-- Navbar Right Menu -->
        <div class="navbar-custom-menu">
          <ul class="nav navbar-nav">
            <!--template "common/header-notifications.html" . -->
            {{ template "common/header-account-menu.html" . }}
          </ul>
        </div>
        <!-- /.navbar-custom-menu -->
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="checkbox">
              <label class="form-check-label" for="checkbox" id="theme-label">Light</label>
            </div>
          </li>
        </ul>

      </div>
      <!-- /.container-fluid -->
    </nav>
    <!-- Full Width Column -->
    <main class="app-main">
      <div class="container-fluid">
        {{ template "common/header-top-navigation.html" . }}
        <!-- Main content -->
        <div class="app-content">
          {{ template "body" . }}
        </div>
        <!-- /.app-content -->
      </div>
      <!-- /.container-fluid -->
    </main>
    <!-- /.app-main -->

    {{template "common/footer.html" .}}
  </div>
  <!-- /.app-wrapper -->

  <script>
    // AdminLTE 4 uses Bootstrap 5.3 native color mode: `data-bs-theme` on <html>
    // instead of the old `body.dark-mode` class. The theme is owned by
    // adminlte.ColorMode, which persists the choice under the "lte-theme"
    // localStorage key and applies it on DOMContentLoaded.
    const checkbox = document.getElementById('checkbox');
    const themeLabel = document.getElementById('theme-label');

    const syncSwitch = () => {
      const dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
      checkbox.checked = dark;
      themeLabel.textContent = dark ? 'Dark' : 'Light';
    };

    // Carry over the preference stored by the previous (AdminLTE 3) release.
    if (!localStorage.getItem('lte-theme') && localStorage.getItem('theme') === 'dark') {
      localStorage.setItem('lte-theme', 'dark');
    }

    checkbox.addEventListener('change', () => {
      new adminlte.ColorMode().setTheme(checkbox.checked ? 'dark' : 'light');
    });

    document.addEventListener('changed.lte.color-mode', syncSwitch);
    document.addEventListener('DOMContentLoaded', syncSwitch);
    syncSwitch();
  </script>

</body>

</html>
