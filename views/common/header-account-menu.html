<!-- User Account Menu -->
<li class='dropdown user user-menu {{if compare .RouterPattern "/profile"}} nav-item{{end}}'>
  <!-- Menu Toggle Button -->
  <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
    <!-- The user image in the navbar-->
    <img src="/static/img/person.png" class="user-image" alt="User Image">
    <!-- The username next to the avatar. -->
    <span>{{ .Userinfo.Name}}</span>
  </a>
  <ul class="dropdown-menu">
    <!-- The user image in the menu -->
    <li class="user-header">
      <img src="/static/img/person.png" class="rounded-circle" alt="User Image">
      <p>
        {{ .Userinfo.Name}}
        <small>Created on {{ .Userinfo.Created.Format "Jan 02, 2006" }}</small>
      </p>
    </li>

    <!-- Menu Footer-->
    <li class="user-footer">
      <div class="float-start">
        <a href='{{urlfor "ProfileController.Get"}}' class="btn btn-secondary">Profile Configuration</a>
      </div>
      <div class="float-end">
        <a href='{{urlfor "LoginController.Logout"}}' class="btn btn-secondary">Sign out</a>
      </div>
    </li>
  </ul>
</li>
