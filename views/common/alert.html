{{if .flash}}
    {{if (index .flash "warning")}}
        <div class="alert alert-warning" role="alert">
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <span class="fas fa-exclamation-triangle" aria-hidden="true"></span>
            <span class="visually-hidden">Warning:</span>
            {{index .flash "warning"}}
        </div>
    {{else if (index .flash "error")}}
        <div class="alert alert-danger" role="alert">
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <span class="fas fa-times-circle" aria-hidden="true"></span>
            <span class="visually-hidden">Error:</span>
            {{index .flash "error"}}
        </div>
    {{else if (index .flash "success")}}
        <div class="alert alert-success" role="alert">
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <span class="fas fa-check-circle" aria-hidden="true"></span>
            <span class="visually-hidden">Success:</span>
            {{index .flash "success"}}
        </div>
    {{end}}
{{end}}
