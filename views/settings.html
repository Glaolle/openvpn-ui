{{ template "layout/base.html" . }}

{{define "head"}}
<title>UI Settings</title>
{{end}}

{{define "body"}}
<div class="card">
  <div class="card-header">
    <h3 class="card-title">OpenVPN UI settings</h3>
    <div class="card-tools">
      <button type="button" class="btn btn-tool" data-lte-toggle="card-collapse">
        <i class="fa fa-minus"></i></button>
    </div>
  </div>
  <!-- /.card-header -->
  <!-- form start -->
  <div class="card-body">
    {{template "common/alert.html" .}}
    <form role="form" action='{{urlfor "SettingsController.Post"}}' method="post">
      <div class="card-body">
        <!-- Disabled Profile - yet another feature to implement.
      <div class="mb-3">
        <label for="name">Profile</label>
        <input type="text" class="form-control" id="Profile" disabled
          value=" {{ .Settings.Profile }} ">
      </div>
      Disabled profile -->
        <div class="mb-3">
          <label class="col-form-label" for="name">Management interface address</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-cog"></i></span>
            <input type="text" class="form-control" id="MIAddress" title="OpenVPN management interface address."
              name="MIAddress" placeholder="openvpn:2080" value="{{ .Settings.MIAddress }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="col-form-label" for="name">Management interface protocol</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-exchange-alt"></i></span>
            <input type="text" class="form-control" id="MINetwork" title="OpenVPN management interface protocol."
              name="MINetwork" placeholder="tcp" value="{{ .Settings.MINetwork }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="col-form-label" for="name">OpenVPN ConfigPath</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
            <input type="text" class="form-control" id="OVConfigPath" name="OVConfigPath"
              title="OpenVPN configuration path." placeholder="/etc/openvpn" value="{{ .Settings.OVConfigPath }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="col-form-label" for="name">EasyRSA ConfigPath</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
            <input type="text" class="form-control" id="EasyRSAPath" name="EasyRSAPath"
              title="EasyRSA configuration path." placeholder="/usr/share/easy-rsa" value="{{ .Settings.EasyRSAPath }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="col-form-label" for="name">AutoPrefix</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-exchange-alt"></i></span>
            <input type="text" class="form-control" id="AutoPrefix" name="AutoPrefix" title="AutoPrefix for Nginx."
              placeholder="/test" value="{{ .Settings.AutoPrefix }}">
          </div>
        </div>

        {{ .xsrfdata }}

        <button type="submit" class="btn btn-primary" style="width: 125px;">Save Config</button>
      </div>
      <!-- /.card-body -->
    </form>
  </div>
</div>
<!-- /.card -->
{{end}}
