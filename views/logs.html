{{ template "layout/base.html" . }}
{{define "head"}}
<title>OpenVPN - Logs</title>
{{end}}

{{define "body"}}
<div class="card">
  <div class="card-header">
    <h3 class="card-title">OpenVPN Server log</h3>
    <div class="card-tools">
      <button type="button" class="btn btn-tool" data-lte-toggle="card-collapse">
        <i class="fa fa-minus"></i></button>
    </div>
  </div>
  <div class="card-body">
    <form id="FormLogs"role="form">
      <div class="mb-3">
        <textarea type="text" class="form-control my-textarea" name="Logs" id="Logs" spellcheck="false" rows="15">
{{ range $i, $line := .logs }}{{$line}}
{{ end }}
        </textarea>
      </div>
    </form>
    <span class="text-muted">Last 300 lines of openvpn.log</span>
  </div>
  <!-- /.card-body -->
</div>

<script>
  // custom.js is loaded with defer from views/common/header.html
  window.addEventListener('load', function () {
    // AdminLTE 4 keeps the resolved theme on the html data-bs-theme attribute
    if (document.documentElement.getAttribute('data-bs-theme') === 'dark') {
      createEditor("Logs", "640px", "clouds_midnight", "ovpn", true);
    } else {
      createEditor("Logs", "640px", "clouds", "ovpn", true);
    }
  });
</script>
<!-- /.box -->
{{end}}
